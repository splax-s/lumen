# The town: every object, the lesson that lives in it, and the threads that link them.
# Lesson files must agree with this file; the build fails if they do not.

places:
  kitchen: Kitchen
  music-room: Music room
  rooftop: Rooftop
  garden: Garden
  playground: Playground
  sky: Sky

subjects:
  maths: Maths
  physics: Physics
  chemistry: Chemistry
  biology: Biology
  music: Music

threads:
  - id: particles
    name: Tiny particles
    objects: [glass, kettle, baking-soda, gate]
  - id: waves
    name: Waves
    objects: [guitar, djembe, dish, telescope]
  - id: energy
    name: Energy
    objects: [kettle, swing, slide]
  - id: patterns
    name: Patterns
    objects: [sunflower, piano, djembe, moon, record-player]
  - id: living
    name: Living things
    objects: [onion, seedling, bee, beetles, sunflower]
  - id: measuring
    name: Measuring
    objects: [scale, seesaw, slide, dice]

objects:
  - id: glass
    name: Glass of ice water
    lesson: chem.ice-floats
    number: 1
