    place: kitchen
    question: Why does ice float?
    blurb: Drop things into water, then zoom in on freezing molecules.
    needs: []
  - id: kettle
    name: Kettle
    lesson: chem.kettle-boil
    number: 2
    subject: chemistry
    place: kitchen
    question: Where does boiling water go?
    blurb: Heat water and watch its particles escape as steam.
    needs: [chem.ice-floats]
  - id: baking-soda
    name: Baking soda and vinegar
    lesson: chem.baking-soda
    number: 3
    subject: chemistry
    place: kitchen
    question: Why does baking soda fizz?
    blurb: Mix two things, warm them up, and count the bubbles.
    needs: [chem.kettle-boil]
  - id: gate
    name: Rusty garden gate
    lesson: chem.rust
    number: 4
    subject: chemistry
    place: garden
    question: Why does iron rust?
