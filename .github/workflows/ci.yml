name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @lumen/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lumen, POSTGRES_PASSWORD: lumen, POSTGRES_DB: lumen_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run: { working-directory: apps/api }
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://lumen:lumen@localhost:5432/lumen_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm --filter @lumen/lessons build
        working-directory: .
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
