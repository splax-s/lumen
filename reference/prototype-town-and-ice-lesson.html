<title>Lumen Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sketchbook town. Everything starts as black ink; learning paints real objects in their real colours. Lumi guides from a strip under the scene. */
:root{
  --paper:#fafaf8; --ink:#1b1c1f; --ink-2:#55575d; --muted:#93959b; --rule:#dcdcd8; --wash:#f1f1ee;
  --sky:#eaf2f8; --ground:#e8e6df; --water:#8fcff2; --glow:#ffbf1f;
  --math:#3d6bff; --phys:#ff6a3d; --chem:#12a982; --bio:#4e9f2a; --music:#dc3f7a;
  --stars:0; --clouds:1;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131417; --ink:#ecebe6; --ink-2:#b4b3ad; --muted:#7c7d82; --rule:#2e2f33; --wash:#1b1c20;
  --sky:#0f1626; --ground:#1c1d21; --water:#2f7aa8; --glow:#ffcc3d;
  --math:#7593ff; --phys:#ff8a62; --chem:#35d2a6; --bio:#7cc653; --music:#ff6e9f;
  --stars:1; --clouds:0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131417; --ink:#ecebe6; --ink-2:#b4b3ad; --muted:#7c7d82; --rule:#2e2f33; --wash:#1b1c20;
  --sky:#0f1626; --ground:#1c1d21; --water:#2f7aa8; --glow:#ffcc3d;
  --math:#7593ff; --phys:#ff8a62; --chem:#35d2a6; --bio:#7cc653; --music:#ff6e9f;
  --stars:1; --clouds:0; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.lit{font-family:var(--f-mono);font-size:.78rem;display:flex;align-items:center;gap:8px}
.lit .bar{width:90px;height:8px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.lit .bar i{display:block;height:100%;background:var(--glow);transition:width .8s}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ghost{background:none;border:0;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* map */
.mapbox{border:2px solid var(--ink);border-radius:18px;overflow-x:auto;background:var(--sky)}
.mapbox svg{display:block;width:100%;min-width:880px;height:auto}
.scene{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wall{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.room{fill:var(--wash);stroke:none}
.place{font-family:var(--f-mono);font-size:13px;fill:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stars{opacity:var(--stars)} .clouds{opacity:var(--clouds)}
.clouds path{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.stars path{fill:var(--ink)}
.obj{cursor:pointer;transition:opacity .4s}
.obj .hit{fill:transparent}
.obj .o{fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.obj .f,.obj .f2,.obj .f3{fill:var(--paper);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;transition:fill 1.2s}
.obj .l{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.obj .t{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round}
.obj .k{fill:var(--ink)}
.obj .wtr{fill:var(--paper);stroke:none;transition:fill 1.2s}
.obj.done .f{fill:var(--c)} .obj.done .f2{fill:var(--c2)} .obj.done .f3{fill:var(--c3)}
.obj.done .wtr{fill:var(--water);opacity:.7}
.obj:hover .o,.obj:hover .f,.obj:hover .f2,.obj:hover .f3,.obj:focus-visible .f{stroke-width:3}
.obj:focus{outline:none}
.obj:focus-visible .ring{stroke:var(--ink);opacity:1}
.ring{fill:none;stroke:var(--glow);stroke-width:4;stroke-dasharray:10 8;opacity:0}
.obj.next .ring{opacity:1;animation:spin 6s linear infinite}
.obj.soonnext .ring{opacity:.8;stroke:var(--muted);stroke-dasharray:4 7}
@keyframes spin{to{stroke-dashoffset:-180}}
.badge{opacity:0;transition:opacity .6s .8s}
.obj.done .badge{opacity:1}
.tagt{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--paper)}
.tagbg{fill:var(--ink)}
.dim .obj:not(.linked){opacity:.22}
.thread{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-22}}
.steam path{animation:rise 2.4s ease-in-out infinite;opacity:0}
.obj.done .steam path{opacity:.8}
@keyframes rise{0%{transform:translateY(6px);opacity:0}40%{opacity:.8}100%{transform:translateY(-14px);opacity:0}}
.obj.done .swingseat{animation:swing 2.8s ease-in-out infinite;transform-box:view-box}
@keyframes swing{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}

/* Lumi strip */
.lumistrip{display:flex;align-items:flex-end;gap:12px}
.lumi{width:76px;height:86px;flex:0 0 auto;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.lumi .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--ink);border-radius:18px;padding:12px 16px;background:var(--paper);font-size:1.08rem;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.bubble::before{content:"";position:absolute;left:-11px;bottom:18px;width:18px;height:18px;background:var(--paper);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bubble p{margin:0;min-width:0}
.bubble b.who{font-family:var(--f-display);font-weight:800;margin-right:6px}
.speak{flex:0 0 auto;border:1.5px solid var(--ink);background:none;border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.speak svg{width:16px;height:16px}

/* threads & collection */
.row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.panel{border:2px solid var(--ink);border-radius:18px;padding:14px 16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0 0 2px}
.panel .sub{color:var(--ink-2);font-size:.92rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;background:none;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem;display:inline-flex;gap:8px;align-items:center}
.chip small{font-family:var(--f-mono);font-weight:500;font-size:.7rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] small{color:var(--paper);opacity:.7}
.cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.kcard{flex:0 0 200px;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--paper)}
.kcard .s{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.kcard .s i,.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.kcard p{margin:6px 0 0;font-weight:700;line-height:1.3}
.empty{color:var(--muted);font-size:.95rem;margin:0}

/* bottom sheet */
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100%);box-sizing:border-box;background:var(--paper);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));transition:transform .3s;z-index:20;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet.open{transform:translate(-50%,0)}
.sheet .s{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:1.55rem;line-height:1.15;margin:6px 0 8px;text-wrap:balance}
.sheet p{margin:0 0 8px;color:var(--ink-2)}
.sheet .links{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.sheet .links button{border:1.5px solid var(--rule);background:var(--wash);border-radius:999px;padding:3px 10px;font-size:.85rem;cursor:pointer}
.sheet .acts{display:flex;gap:10px;align-items:center;justify-content:space-between}
.x{position:absolute;right:14px;top:12px;background:none;border:0;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px}

.big{background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:12px 24px;font-weight:700;font-size:1.05rem;cursor:pointer;font-family:var(--f-display)}
.big:hover{background:var(--glow);color:#1b1c1f;border-color:var(--glow)}
.big[disabled]{background:none;color:var(--muted);border-color:var(--rule);cursor:not-allowed}
.big.sec{background:none;color:var(--ink)}

/* lesson */
.lesson{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.lesson[hidden]{display:none!important}
.lhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:2px solid var(--ink);max-width:1000px;width:100%;margin:0 auto}
.dots{display:flex;gap:6px}
.dots i{width:28px;height:8px;border-radius:8px;border:1.5px solid var(--ink)}
.dots i.on{background:var(--glow)} .dots i.cur{background:var(--ink)}
.stage{flex:1;min-height:0;overflow:auto;max-width:1000px;width:100%;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:14px}
.lfoot{max-width:1000px;width:100%;margin:0 auto;padding-block:12px 16px;display:flex;gap:14px;align-items:flex-end;border-top:2px solid var(--ink)}
.lfoot .lumistrip{flex:1;min-width:0}
.lfoot .navs{display:flex;gap:8px;flex:0 0 auto}
.q{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
.sim{width:100%;height:clamp(240px,46vh,440px);display:block;border:2px solid var(--ink);border-radius:16px;background:var(--paper)}
.tray{display:flex;flex-wrap:wrap;gap:10px}
.itm{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--ink);background:var(--paper);border-radius:14px;padding:8px 14px 8px 8px;cursor:pointer;font-weight:700}
.itm svg{width:34px;height:34px}
.itm:hover{background:var(--wash)}
.itm[disabled]{opacity:.45;cursor:default}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick{border:2px solid var(--ink);border-radius:18px;background:var(--paper);padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;text-align:center}
.pick svg{width:100%;max-width:120px;height:auto}
.pick.glowing{box-shadow:0 0 0 5px var(--glow)}
.pick.right{background:var(--glow);color:#1b1c1f}
.pick.wrong{opacity:.4}
.slider{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slider label{font-weight:700}
.slider input{flex:1;min-width:180px;accent-color:var(--chem);height:28px}
.slider output{font-family:var(--f-mono);font-size:1.1rem;min-width:84px}
.statement{border:2px solid var(--ink);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px}
.statement .q em{font-style:normal;background:var(--glow);color:#1b1c1f;padding:0 .15em;border-radius:6px}
.statement p{margin:0;font-size:1.15rem;max-width:60ch}
.formula{font-family:var(--f-mono);font-size:1.05rem;border-top:2px solid var(--ink);padding-top:12px;display:grid;gap:6px}
.formula table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.formula td{padding:4px 18px 4px 0;border-bottom:1px solid var(--rule)}
.sorts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sort{border:2px solid var(--ink);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.sort svg{width:40px;height:40px;flex:0 0 auto}
.sort .nm{flex:1;min-width:0;font-weight:700;line-height:1.2}
.sort .nm small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--muted)}
.sort .b{display:flex;gap:6px}
.sort .b button{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:.85rem}
.sort.ok{background:var(--wash)}
.sort.ok .b button.sel{background:var(--ink);color:var(--paper)}
.sort.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.bigcard{border:2px solid var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--paper);box-shadow:8px 8px 0 var(--glow)}
.bigcard .s{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;display:flex;gap:8px;align-items:center}
.bigcard p{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.15}
.where{display:flex;flex-direction:column;gap:8px}
.where h3{font-family:var(--f-display);margin:0;font-size:1.1rem}
.where div{border:2px solid var(--rule);border-radius:14px;padding:10px 12px}
.where b{display:block}
.where span{color:var(--ink-2);font-size:.92rem}

@media (max-width:820px){
  .row2,.keep{grid-template-columns:minmax(0,1fr)}
  .picks{grid-template-columns:minmax(0,1fr)}
  .pick{flex-direction:row;justify-content:flex-start;text-align:left}
  .pick svg{width:70px}
  .lfoot{flex-direction:column;align-items:stretch}
  .lfoot .navs{justify-content:flex-end}
  .lumi{width:56px;height:64px}
  .bubble{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="town">
  <header class="top">
    <div class="brand"><b>Lumen</b><span>Town</span></div>
    <div class="meta">
      <div class="lit" aria-live="polite"><span class="bar"><i id="litBar" style="width:0"></i></span><span id="litTxt">0 of 17 lit up</span></div>
      <div class="seg" role="group" aria-label="Depth">
        <button type="button" data-depth="play">Play</button><button type="button" data-depth="explain">Explain</button><button type="button" data-depth="deep">Deep</button>
      </div>
      <button class="ghost" id="resetAll" type="button">Reset progress</button>
    </div>
  </header>

  <div class="mapbox"><svg id="map" viewBox="0 0 1440 700" role="img" aria-label="Lumen Town: a house with a rooftop, music room and kitchen, a garden and a playground"></svg></div>

  <div class="lumistrip" id="townLumi"></div>

  <div class="row2">
    <section class="panel">
      <h2>Threads</h2>
      <p class="sub">The same idea shows up in different places. Pick one to see where.</p>
      <div class="chips" id="chips"></div>
    </section>
    <section class="panel">
      <h2>Your cards</h2>
      <p class="sub">One card for every lesson you finish.</p>
      <div class="cards" id="cards"></div>
    </section>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="shTitle">
  <button class="x" id="shX" type="button" aria-label="Close">×</button>
  <div class="s" id="shSubj"></div>
  <h3 id="shTitle"></h3>
  <p id="shBody"></p>
  <div class="links" id="shLinks"></div>
  <div class="acts"><span id="shState" class="ghost" style="text-decoration:none"></span><button class="big" id="shGo" type="button">Start lesson</button></div>
</div>

<div class="lesson" id="lesson" hidden>
  <div class="lhead">
    <button class="big sec" id="lBack" type="button" style="padding:8px 16px;font-size:.9rem">← Town</button>
    <div class="dots" id="dots" aria-label="Lesson progress"></div>
    <div class="seg" role="group" aria-label="Depth">
      <button type="button" data-depth="play">Play</button><button type="button" data-depth="explain">Explain</button><button type="button" data-depth="deep">Deep</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="lfoot">
    <div class="lumistrip" id="lessonLumi"></div>
    <div class="navs"><button class="big sec" id="lPrev" type="button">Back</button><button class="big" id="lNext" type="button">Next</button></div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s), TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- state ---------- */
let S={depth:'play',done:[]};
try{const j=JSON.parse(localStorage.getItem('lumen.town')||'null');if(j&&Array.isArray(j.done))S=Object.assign(S,j)}catch(_){}
const save=()=>{try{localStorage.setItem('lumen.town',JSON.stringify(S))}catch(_){}};
const D=o=>typeof o==='string'?o:(o[S.depth]||o.explain||o.play);

/* ---------- Lumi ---------- */
function lumiSVG(mood){
  const eyes={happy:'<ellipse class="eye" cx="32" cy="50" rx="3.2" ry="4.6" fill="var(--ink)"/><ellipse class="eye" cx="48" cy="50" rx="3.2" ry="4.6" fill="var(--ink)"/>',
    think:'<ellipse class="eye" cx="34" cy="46" rx="3" ry="4.4" fill="var(--ink)"/><ellipse class="eye" cx="50" cy="46" rx="3" ry="4.4" fill="var(--ink)"/>',
    wow:'<circle cx="32" cy="49" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><circle cx="48" cy="49" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><circle cx="32" cy="49" r="2.4" fill="var(--ink)"/><circle cx="48" cy="49" r="2.4" fill="var(--ink)"/>',
    proud:'<path d="M28,52 Q32,46 36,52 M44,52 Q48,46 52,52" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>'}[mood]||'';
  const mouth={happy:'<path d="M34,62 Q40,68 46,62" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>',
    think:'<path d="M36,64 L45,62" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>',
    wow:'<ellipse cx="40" cy="65" rx="4" ry="5" fill="var(--ink)"/>',
    proud:'<path d="M32,60 Q40,72 48,60 Z" fill="var(--ink)"/>'}[mood]||'';
  return `<svg class="lumi" viewBox="0 0 80 90" aria-hidden="true"><circle cx="40" cy="52" r="36" fill="var(--glow)" opacity=".22"/>
  <path d="M40,24 C40,15 44,9 49,7" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="50" cy="7" r="5.5" fill="var(--glow)" stroke="var(--ink)" stroke-width="2.2"/>
  <path d="M40,24 C60,24 70,39 68,57 C66,75 54,82 40,82 C26,82 14,75 12,57 C10,39 20,24 40,24 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.6"/>
  <circle cx="25" cy="60" r="4" fill="var(--glow)" opacity=".6"/><circle cx="55" cy="60" r="4" fill="var(--glow)" opacity=".6"/>${eyes}${mouth}
  <ellipse cx="32" cy="84" rx="6" ry="3" fill="var(--ink)"/><ellipse cx="48" cy="84" rx="6" ry="3" fill="var(--ink)"/></svg>`;
}
const SPK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="var(--ink)"/><path d="M11 5c1.2 1.6 1.2 4.4 0 6M13 3c2.3 2.8 2.3 7.2 0 10" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/></svg>';
function say(el,text,mood='happy'){

function status(o){
  if(S.done.includes(o.id))return'done';
  if(o.after&&!S.done.includes(o.after))return'locked';
  return o.built?'next':(o.after?'soonnext':'soon');
}
function refreshTown(){
  let tags='';
  for(const o of O){const el=$('#o-'+o.id),st=status(o);el.classList.toggle('done',st==='done');el.classList.toggle('next',st==='next');el.classList.toggle('soonnext',st==='soonnext');
    if(st==='next')tags+=tag(o.cx,o.cy+66,'Start here');}
  $('#tagLayer').innerHTML=tags;
  const n=S.done.length;$('#litTxt').textContent=`${n} of ${ORDER_N} lit up`;$('#litBar').style.width=(100*n/ORDER_N)+'%';
  $('#cards').innerHTML=n?S.done.map(id=>{const o=byId[id];return`<div class="kcard"><div class="s"><i style="background:var(${SUBJ[o.subj][1]})"></i>${SUBJ[o.subj][0]}</div><p>${CARD[id]||o.q}</p></div>`}).join(''):'<p class="empty">Finish a lesson to earn your first card.</p>';
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.depth===S.depth));
  townSay();
}
function tag(x,y,t){const w=t.length*8+20;return`<rect class="tagbg" x="${x-w/2}" y="${y-14}" width="${w}" height="24" rx="12"/><text class="tagt" x="${x}" y="${y+3}" text-anchor="middle">${t}</text>`}
function townSay(){
  const el=$('#townLumi');
  if(!S.done.includes('ice'))say(el,D({play:"Hi, I'm Lumi! This whole town is full of secrets. Tap the glass of ice water in the kitchen to start.",explain:"Hi, I'm Lumi. Every object in this town hides a science idea. Start with the glass of ice water in the kitchen.",deep:"I'm Lumi. Each object here is a lesson, and the threads show how ideas connect across subjects. Begin with the ice water in the kitchen."}),'happy');
  else say(el,D({play:"You lit up the glass! Look, it has colour now. In the full app, the kettle is next.",explain:"The glass is lit up. Next in line is the kettle, where the same tiny particles start escaping as steam.",deep:"Ice done. The 'Tiny particles' thread continues at the kettle (evaporation) and the baking soda (reactions)."}),'proud');
}

/* threads */
let activeThread=null;
function drawThread(){
  const L=$('#threadLayer');document.querySelectorAll('.obj').forEach(e=>e.classList.remove('linked'));map.classList.toggle('dim',!!activeThread);
  if(!activeThread){L.innerHTML='';return}
  const t=THREADS.find(x=>x.id===activeThread),pts=t.ids.map(i=>byId[i]);let d=`M${pts[0].cx},${pts[0].cy}`;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],mx=(a.cx+b.cx)/2,my=Math.min(a.cy,b.cy)-70;d+=` Q${mx},${my} ${b.cx},${b.cy}`}
  L.innerHTML=`<path class="thread" d="${d}"/>`+pts.map(p=>`<circle cx="${p.cx}" cy="${p.cy}" r="7" fill="var(--glow)" stroke="var(--ink)" stroke-width="2"/>`).join('');
  t.ids.forEach(i=>$('#o-'+i).classList.add('linked'));
}
$('#chips').innerHTML=THREADS.map(t=>`<button class="chip" type="button" data-t="${t.id}" aria-pressed="false">${t.name}<small>${t.ids.length} places</small></button>`).join('');
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;activeThread=activeThread===b.dataset.t?null:b.dataset.t;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t===activeThread));drawThread()});

/* sheet */
let sheetId=null;
function openSheet(id){
  const o=byId[id],st=status(o);sheetId=id;
  $('#shSubj').innerHTML=`<i class="dot" style="background:var(${SUBJ[o.subj][1]})"></i>${SUBJ[o.subj][0]} · ${PLACE[o.place]}`;
  $('#shTitle').textContent=o.q;$('#shBody').textContent=o.play;
  const ts=THREADS.filter(t=>t.ids.includes(id));
  $('#shLinks').innerHTML=ts.map(t=>`<button type="button" data-t="${t.id}">Thread: ${t.name} · ${t.ids.filter(i=>i!==id).map(i=>byId[i].q.replace(/\?$/,'').split(' ').slice(-2).join(' ')).length} more</button>`).join('');
  const go=$('#shGo');
  if(o.built){go.disabled=false;go.textContent=st==='done'?'Play again':'Start lesson';$('#shState').textContent=st==='done'?'Lit up ✓':'About 5 minutes'}
  else{go.disabled=true;go.textContent='Coming soon';$('#shState').textContent=o.after&&!S.done.includes(o.after)?`Opens after “${byId[o.after].q}”`:'Not in this prototype yet'}
  $('#sheet').classList.add('open');
}
const closeSheet=()=>{$('#sheet').classList.remove('open');sheetId=null};
$('#shX').onclick=closeSheet;

/* canvas helpers */
function fit(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1),w=Math.max(1,r.width),h=Math.max(1,r.height);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);return[g,w,h]}
function loop(fn){let on=true,last=performance.now();const f=t=>{if(!on)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt,t/1000);requestAnimationFrame(f)};requestAnimationFrame(f);return()=>{on=false}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function tank(cv,preset,labels){
  const items=[];let C={};
  const add=(id,slot,instant)=>items.push({id,def:ITEMS[id],slot,yb:null,v:0,t:instant?5:0,ph:Math.random()*6,instant});
  preset.forEach((id,i)=>add(id,i,true));
  const stop=loop((dt,t)=>{
    const[g,W,H]=fit(cv);C={ink:tok('--ink'),paper:tok('--paper'),water:tok('--water'),muted:tok('--muted'),rule:tok('--rule')};
    const s=clamp(Math.min(W/560,H/300),.7,1.8),tx=W*.08,tw=W*.84,top=H*.14,surf=H*.36,floor=H*.9;
    g.fillStyle=C.paper;g.fillRect(0,0,W,H);
    g.globalAlpha=.45;g.fillStyle=C.water;g.fillRect(tx,surf,tw,floor-surf);g.globalAlpha=1;
    const n=Math.max(4,items.length);
    for(const it of items){const d=it.def,w=d.w*s,h=d.h*s,x=tx+tw*(it.slot+.5)/n;
      const tb=d.rho<1?surf+h*d.rho+Math.sin(t*2+it.ph)*1.2:floor;
      if(it.yb===null)it.yb=it.instant?tb:top-10;
      if(it.yb<surf){it.v+=900*dt}else{const k=d.rho<1?40:6,c=d.rho<1?7:3.5;it.v+=(k*(tb-it.yb)-c*it.v)*dt;if(d.rho>=1)it.v=Math.min(it.v,160*s)}
      it.yb+=it.v*dt;if(it.yb>floor){it.yb=floor;it.v=0}it.t+=dt;
      drawItem(g,it.id,x,it.yb,w,h,C);
      it.x=x;it.h=h}
    g.globalAlpha=.32;g.fillStyle=C.water;g.fillRect(tx,surf,tw,floor-surf);g.globalAlpha=1;
    g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.moveTo(tx,surf);for(let x=tx;x<=tx+tw;x+=8)g.lineTo(x,surf+Math.sin(x*.05+t*2)*1.2);g.stroke();
    g.lineWidth=3;g.beginPath();g.moveTo(tx,top);g.lineTo(tx,floor);g.lineTo(tx+tw,floor);g.lineTo(tx+tw,top);g.stroke();
    if(labels)for(const it of items){if(it.t<1.3)continue;const d=it.def,fl=d.rho<1;
      const txt=S.depth==='play'?(fl?'Floats!':'Sinks'):S.depth==='explain'?(fl?`Floats · ${Math.round(d.rho*100)}% under`:'Sinks'):`ρ ${d.rho} g/cm³`+(fl?` · ${Math.round(d.rho*100)}% under`:'');
      g.font=`700 ${Math.round(13*Math.min(s,1.3))}px "Atkinson Hyperlegible", sans-serif`;g.textAlign='center';const tw2=g.measureText(txt).width+16,ly=fl?surf-it.h*(1-d.rho)-18:floor-it.h-16;
      g.fillStyle=C.ink;rr(g,it.x-tw2/2,ly-14,tw2,22,11);g.fill();g.fillStyle=C.paper;g.fillText(txt,it.x,ly+2)}
  });
  return{stop,drop:id=>add(id,items.length,false),has:id=>items.some(i=>i.id===id),count:()=>items.length};
}
function drawItem(g,id,x,yb,w,h,C){
  const d=ITEMS[id];g.lineWidth=2;g.strokeStyle=C.ink;g.fillStyle=d.col;
  if(id==='coin'){rr(g,x-w/2,yb-h,w,h,h/2);g.fill();g.stroke()}
  else if(id==='cork'){g.beginPath();g.moveTo(x-w/2,yb-h);g.lineTo(x+w/2,yb-h);g.lineTo(x+w*.4,yb);g.lineTo(x-w*.4,yb);g.closePath();g.fill();g.stroke()}
  else if(id==='ice'){rr(g,x-w/2,yb-h,w,h,w*.18);g.fill();g.stroke();g.beginPath();g.moveTo(x-w*.28,yb-h*.72);g.lineTo(x-w*.05,yb-h*.85);g.stroke()}
  else if(id==='apple'){g.beginPath();g.ellipse(x,yb-h/2,w/2,h/2,0,0,TAU);g.fill();g.stroke();g.beginPath();g.moveTo(x,yb-h);g.lineTo(x+2,yb-h-8);g.stroke();g.fillStyle='#4e9f2a';g.beginPath();g.ellipse(x+8,yb-h-5,6,3,-.4,0,TAU);g.fill();g.stroke()}
  else{g.beginPath();g.moveTo(x-w/2,yb);g.quadraticCurveTo(x-w/2,yb-h,x-w*.1,yb-h);g.quadraticCurveTo(x+w/2,yb-h*1.05,x+w/2,yb);g.closePath();g.fill();g.stroke()}
}

/* molecules */
function molecules(cv,onFrozen){
  const a=26,cols=6,rows=4,lat=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=i*Math.sqrt(3)*a+(j%2)*Math.sqrt(3)*a/2,y=j*1.5*a*2;lat.push({x,y,s:0},{x,y:y+a,s:1})}
  const mnx=Math.min(...lat.map(p=>p.x)),mxx=Math.max(...lat.map(p=>p.x)),mny=Math.min(...lat.map(p=>p.y)),mxy=Math.max(...lat.map(p=>p.y));
  lat.forEach(p=>{p.x=(p.x-(mnx+mxx)/2);p.y=(p.y-(mny+mxy)/2)});
  const spanX=mxx-mnx,spanY=mxy-mny,liq=[];
  while(liq.length<lat.length){const p={x:(Math.random()-.5)*spanX/1.09,y:(Math.random()-.5)*spanY/1.02};if(liq.every(q=>(q.x-p.x)**2+(q.y-p.y)**2>(a*.86)**2)||liq.length>200)liq.push(p)}
  const free=liq.slice(),M=lat.map(L=>{let bi=0,bd=1e9;free.forEach((p,i)=>{const d=(p.x-L.x)**2+(p.y-L.y)**2;if(d<bd){bd=d;bi=i}});const p=free.splice(bi,1)[0];
    return{L,P:p,ph:Math.random()*TAU,w:1.5+Math.random()*2,ang:Math.random()*TAU,spin:(Math.random()-.5)*3}});
  const bonds=[];for(let i=0;i<lat.length;i++)for(let j=i+1;j<lat.length;j++){const d=Math.hypot(lat[i].x-lat[j].x,lat[i].y-lat[j].y);if(d<a*1.05)bonds.push([i,j])}
  let T=20,f=0,fired=false;
  const stop=loop((dt,t)=>{
    const[g,W,H]=fit(cv),C={ink:tok('--ink'),paper:tok('--paper'),water:tok('--water'),muted:tok('--muted'),rule:tok('--rule'),wash:tok('--wash')};
    f+=((T<=0?1:0)-f)*Math.min(1,dt*2.2);if(f>.95&&!fired){fired=true;onFrozen()}
    const sc=Math.min((W-120)/(spanX+a*2.4),(H-70)/(spanY+a*2.4)),cx=W/2,cy=H/2+10;
    g.fillStyle=C.paper;g.fillRect(0,0,W,H);
    const bw=(spanX/1.09+a*2)*(1+.09*f)*sc,bh=(spanY+a*2)*sc;
    g.fillStyle=C.wash;g.fillRect(cx-bw/2,cy-bh/2,bw,bh);g.strokeStyle=C.ink;g.lineWidth=2.5;g.strokeRect(cx-bw/2,cy-bh/2,bw,bh);
    g.font='500 13px "IBM Plex Mono", monospace';g.fillStyle=C.ink;g.textAlign='center';
    g.fillText(`Space taken: ${Math.round(100+9*f)}%`,cx,cy-bh/2-12);
    g.strokeStyle=C.muted;g.lineWidth=1;g.beginPath();g.moveTo(cx-bw/2,cy+bh/2+12);g.lineTo(cx+bw/2,cy+bh/2+12);g.stroke();
    const amp=(1-f)*(5+Math.max(0,T)*.35)+f*1.2,pos=M.map(m=>{const jx=Math.sin(t*m.w+m.ph)*amp,jy=Math.cos(t*m.w*1.3+m.ph)*amp;
      return{x:cx+((m.P.x*(1-f)+m.L.x*f)*sc)+jx,y:cy+((m.P.y*(1-f)+m.L.y*f)*sc)+jy}});
    if(f>.3){g.globalAlpha=(f-.3)/.7;g.setLineDash([3,4]);g.strokeStyle=C.ink;g.lineWidth=1.4;for(const[i,j]of bonds){g.beginPath();g.moveTo(pos[i].x,pos[i].y);g.lineTo(pos[j].x,pos[j].y);g.stroke()}g.setLineDash([]);g.globalAlpha=1}
    const r=Math.max(6,a*.32*sc),hr=r*.55,hd=r*1.15,half=104.5/2*Math.PI/180;
    M.forEach((m,i)=>{m.ang+=m.spin*dt*(1-f);const base=m.L.s?Math.PI/2:-Math.PI/2,ang=m.ang*(1-f)+base*f,p=pos[i];
      for(const s of[-1,1]){const aa=ang+s*half;g.beginPath();g.arc(p.x+Math.cos(aa)*hd,p.y+Math.sin(aa)*hd,hr,0,TAU);g.fillStyle='#ffffff';g.fill();g.strokeStyle=C.ink;g.lineWidth=1.6;g.stroke()}
      g.beginPath();g.arc(p.x,p.y,r,0,TAU);g.fillStyle='#e5484d';g.fill();g.stroke()});
    g.textAlign='left';g.font='500 12px "IBM Plex Mono", monospace';g.fillStyle=C.muted;
    g.fillText(S.depth==='deep'?'● O  ○ H  - - hydrogen bond':S.depth==='explain'?'red: oxygen · white: hydrogen':'each red ball with two white ones is one tiny piece of water',12,H-12);
  });
  return{stop,setT:v=>T=v};
}

/* lake */
function lake(cv){
  let mode='real',ice=0;const fish=Array.from({length:6},(_,i)=>({x:Math.random(),y:.45+Math.random()*.4,v:(Math.random()<.5?-1:1)*(.05+Math.random()*.05),frozen:false}));
  const stop=loop((dt,t)=>{
    const[g,W,H]=fit(cv),C={ink:tok('--ink'),paper:tok('--paper'),water:tok('--water'),muted:tok('--muted'),sky:tok('--sky'),ground:tok('--ground')};
    ice=Math.min(mode==='real'?.22:1,ice+dt*(mode==='real'?.08:.12));
    g.fillStyle=C.sky;g.fillRect(0,0,W,H);
    const top=H*.28,bot=H*.92,l=W*.06,r=W*.94,depth=bot-top;
    g.fillStyle=C.ground;g.beginPath();g.moveTo(0,top);g.lineTo(l,top);g.quadraticCurveTo(W/2,bot+depth*.25,r,top);g.lineTo(W,top);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
    g.save();g.beginPath();g.moveTo(l,top);g.quadraticCurveTo(W/2,bot+depth*.25,r,top);g.closePath();g.clip();
    g.fillStyle=C.water;g.globalAlpha=.6;g.fillRect(0,top,W,H);g.globalAlpha=1;
    const iceTop=mode==='real'?top:bot+depth*.1-ice*(depth*1.1),iceBot=mode==='real'?top+ice*depth:bot+depth*.2;
    g.fillStyle='#e3f5ff';g.fillRect(0,iceTop,W,iceBot-iceTop);g.strokeStyle=C.ink;g.lineWidth=2;g.beginPath();g.moveTo(0,mode==='real'?iceBot:iceTop);g.lineTo(W,mode==='real'?iceBot:iceTop);g.stroke();
    for(const fsh of fish){const fy=top+fsh.y*depth;const inIce=fy>iceTop&&fy<iceBot;if(inIce)fsh.frozen=true;
      if(!fsh.frozen){fsh.x+=fsh.v*dt;if(fsh.x<.1||fsh.x>.9)fsh.v*=-1}
      const fx=l+(r-l)*fsh.x,dir=fsh.v>0?1:-1;g.fillStyle=fsh.frozen?tok('--muted'):'#ff8a3d';g.strokeStyle=C.ink;g.lineWidth=1.6;
      g.beginPath();g.ellipse(fx,fy,13,7,0,0,TAU);g.fill();g.stroke();g.beginPath();g.moveTo(fx-dir*12,fy);g.lineTo(fx-dir*21,fy-7);g.lineTo(fx-dir*21,fy+7);g.closePath();g.fill();g.stroke();
      g.fillStyle=C.ink;g.beginPath();g.arc(fx+dir*6,fy-2,1.6,0,TAU);g.fill()}
    g.restore();
    g.strokeStyle=C.ink;g.lineWidth=2.5;g.beginPath();g.moveTo(l,top);g.quadraticCurveTo(W/2,bot+depth*.25,r,top);g.stroke();
    g.font='700 15px "Atkinson Hyperlegible", sans-serif';g.fillStyle=C.ink;g.textAlign='left';
    const alive=fish.filter(f=>!f.frozen).length;
    g.fillText(mode==='real'?'Real world: ice floats':'Pretend world: ice sinks',16,26);g.font='500 13px "IBM Plex Mono", monospace';g.fillText(`Fish swimming: ${alive} of 6`,16,48);
  });
  return{stop,set:m=>{mode=m;ice=0;fish.forEach(f=>f.frozen=false)},mode:()=>mode};
}

function renderStep(depthOnly){
  if(depthOnly&&step!==4&&step!==6&&step!==0){
    const hold=ready;const s=STEPS[step];if(step===1||step===2||step===3||step===5){/* keep interactive state; refresh Lumi only */
      lsay({play:'Depth changed to Play.',explain:'Depth changed to Explain. Labels now show more detail.',deep:'Depth changed to Deep. Numbers and units are now shown.'},'happy');setReady(hold);return}}
  if(cleanup){cleanup();cleanup=null}
  const r=STEPS[step].render();if(typeof r==='function')cleanup=r;
  nextB.textContent=STEPS[step].label;prevB.disabled=step===0;
  $('#dots').innerHTML=STEPS.map((_,i)=>`<i class="${i<step?'on':i===step?'cur':''}"></i>`).join('');
  stage.scrollTop=0;
}
function openLesson(){step=0;L.hidden=false;document.body.style.overflow='hidden';renderStep();nextB.focus()}
function closeLesson(){if(cleanup){cleanup();cleanup=null}try{speechSynthesis.cancel()}catch(_){}L.hidden=true;document.body.style.overflow=''}
nextB.onclick=()=>{if(!ready)return;if(step<STEPS.length-1){step++;renderStep()}else{if(!S.done.includes('ice'))S.done.push('ice');save();closeLesson();refreshTown();
  const el=$('#o-ice');el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}};
prevB.onclick=()=>{if(step>0){step--;renderStep()}};
$('#lBack').onclick=closeLesson;

drawTown();refreshTown();
})();
</script>
