<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen lesson screen</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">

<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F6F6F8; color: #16161D; font-family: 'Atkinson Hyperlegible', Verdana, sans-serif; display: flex; flex-direction: column">

    <button type="button" style="font-family: inherit; font-weight: 700; font-size: 16px; padding: 10px 18px; background: #FFFFFF; border: 1px solid #D6D6DE; border-radius: 999px">Back to town</button>

      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 4px 10px; background: #E1F5EF; color: #0B6B53; border-radius: 999px">Chemistry</span>
      <div aria-label="Step 4 of 7" style="display: flex; gap: 6px">
        <i style="width: 36px; height: 10px; border-radius: 10px; background: #16161D; display: block"></i>
        <i style="width: 36px; height: 10px; border-radius: 10px; background: #16161D; display: block"></i>
        <i style="width: 36px; height: 10px; border-radius: 10px; background: #16161D; display: block"></i>
        <i style="width: 36px; height: 10px; border-radius: 10px; background: #FFC21A; display: block"></i>

        <i style="width: 36px; height: 10px; border-radius: 10px; background: #E6E6EC; display: block"></i>

    </div>

      <button type="button" style="border: 0; padding: 7px 14px; background: #FFFFFF; font-weight: 700; font-family: inherit">Play</button>
      <button type="button" style="border: 0; padding: 7px 14px; background: #1D1A3A; color: #FFFFFF; font-weight: 700; font-family: inherit">Explain</button>
      <button type="button" style="border: 0; padding: 7px 14px; background: #FFFFFF; font-weight: 700; font-family: inherit">Deep</button>

          </g>
        </svg>
      </div>
      <div style="flex: 1; background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between"><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px">Ice · −4 °C</b><span style="font-family: 'IBM Plex Mono', monospace; background: #FFC21A; padding: 0 8px; border-radius: 6px">Space taken: 109%</span></div>
        <svg viewBox="0 0 560 330" role="img" aria-label="Water molecules locked into six-sided rings with gaps in the middle, joined by dashed hydrogen bonds" style="width: 100%; height: auto; flex: 1">
          <rect x="52" y="20" width="456" height="290" rx="10" fill="#E6F6FF" stroke="#1D1A3A" stroke-width="3"></rect>

            <circle cx="396" cy="276" r="6" fill="#FFFFFF"></circle><circle cx="412" cy="276" r="6" fill="#FFFFFF"></circle><circle cx="404" cy="260" r="12" fill="#E5484D"></circle>
            <circle cx="396" cy="336" r="6" fill="#FFFFFF"></circle><circle cx="412" cy="336" r="6" fill="#FFFFFF"></circle><circle cx="404" cy="320" r="12" fill="#E5484D"></circle>

          </g>
          </g>
        </svg>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 18px; background: #FFFFFF; border-radius: 999px; padding: 12px 24px">
      <label for="temp" style="font-weight: 700; font-size: 18px">Temperature</label>
      <input id="temp" type="range" min="-10" max="20" value="-4" style="flex: 1; accent-color: #17C69B; height: 28px">
      <output for="temp" style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; min-width: 80px">−4 °C</output>
    </div>

  <footer style="display: flex; align-items: flex-end; gap: 16px; padding: 16px 40px 24px; border-top: 1px solid #E6E6EC; background: #FFFFFF">
    <svg viewBox="0 0 80 90" width="76" height="86" role="img" aria-label="Lumi amazed">
      <path d="M40,24 C40,15 44,9 49,7" fill="none" stroke="#1D1A3A" stroke-width="2.6" stroke-linecap="round"></path><circle cx="50" cy="7" r="7" fill="#FFF3B0" stroke="#1D1A3A" stroke-width="2.2"></circle>

      <circle cx="32" cy="49" r="5" fill="#FFFFFF" stroke="#1D1A3A" stroke-width="1.8"></circle><circle cx="48" cy="49" r="5" fill="#FFFFFF" stroke="#1D1A3A" stroke-width="1.8"></circle><circle cx="32" cy="49" r="2.4" fill="#1D1A3A"></circle><circle cx="48" cy="49" r="2.4" fill="#1D1A3A"></circle><ellipse cx="40" cy="65" rx="4" ry="5" fill="#1D1A3A"></ellipse>
    </svg>
    <div style="flex: 1; background: #F6F6F8; border-radius: 18px; padding: 14px 18px; font-size: 19px"><b style="font-family: 'Bricolage Grotesque', sans-serif">Lumi</b> Frozen! Each molecule locks onto its neighbours in six-sided rings. The rings leave gaps, so ice takes more room.</div>
    <div style="display: flex; gap: 10px">
      <button type="button" style="font-family: inherit; font-weight: 700; font-size: 18px; padding: 16px 24px; background: #FFFFFF; border: 1px solid #D6D6DE; border-radius: 999px">Back</button>
      <button type="button" style="font-family: inherit; font-weight: 700; font-size: 18px; padding: 16px 30px; background: #16161D; color: #FFFFFF; border: 0; border-radius: 999px">Continue</button>
    </div>
  </footer>
