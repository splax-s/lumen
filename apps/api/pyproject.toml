[project]
name = "lumen-api"
version = "0.1.0"
description = "Lumen learning platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "redis>=5.0",
  "argon2-cffi>=23.1",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "anthropic>=0.40",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
lumen-api = "lumen_api.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "fakeredis>=2.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are sentences of learner-facing text or test data, which read better unbroken.
"tests/*" = ["E501"]
"src/lumen_api/lumi/*" = ["E501"]
"src/lumen_api/cli.py" = ["E501"]
"src/lumen_api/services/*" = ["E501"]
"src/lumen_api/routers/*" = ["E501"]
"src/lumen_api/deps.py" = ["E501"]
"src/lumen_api/schemas.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
